[package]
name = "php2xai-tokenizer-trainer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "php2xai-tokenizer-trainer"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tokenizers = { path = "../../../../ThirdParty/tokenizers/tokenizers" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
